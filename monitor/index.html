<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>調 - Shirabe</title>
    <style>
      body { margin: 0; background: #F6F3EC; color: #1F2328; font-family: 'Hiragino Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { body { background: #15171B; color: #E8E6E1; } }
      #app-loading {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; flex-direction: column; gap: 14px;
        -webkit-app-region: drag;
      }
      #app-loading .mark {
        width: 44px; height: 44px; border-radius: 12px; background: #2F5D8A; color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600;
        box-shadow: 0 8px 24px rgba(31,35,40,.12);
      }
      #app-loading .spinner {
        width: 22px; height: 22px; border: 2px solid #E4DED2;
        border-top-color: #2F5D8A; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loading .text { color: #5F6670; font-size: 12px; letter-spacing: .04em; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div class="mark">調</div>
        <div class="spinner"></div>
        <div class="text">相棒を起こしています…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

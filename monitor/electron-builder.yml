appId: com.shirabe-mail.app
productName: 調 - Shirabe
directories:
  buildResources: build
  output: release
files:
  - dist-electron
  - dist
  - electron/preload.cjs
  # Exclude ripgrep binaries for non-target platforms (saves ~39MB)
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/arm64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-darwin"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-linux"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/ripgrep/x64-win32"
  # Exclude unnecessary files from node_modules
  - "!node_modules/**/{CHANGELOG,changelog,CHANGES,changes}.md"
  - "!node_modules/**/{README,readme}.md"
  - "!node_modules/**/test{,s}/**"
  - "!node_modules/**/*.map"
extraResources:
  - from: "build/tray-iconTemplate.png"
    to: "tray-iconTemplate.png"
  - from: "build/tray-iconTemplate@2x.png"
    to: "tray-iconTemplate@2x.png"
  - from: "resources/emclient-search"
    to: "emclient-search"
  - from: "../mcp-server/build"
    to: "mcp-server/build"
    filter:
      - "**/*.js"
      - "**/*.json"
  - from: "../mcp-server/package.json"
    to: "mcp-server/package.json"
  - from: "../mcp-server/node_modules"
    to: "mcp-server/node_modules"
    filter:
      - "!**/typescript/**"
      # 実行時に要らない開発用(.bin のリンクは typescript を外すと宙に浮き、署名で落ちる)
      - "!.bin{,/**}"
      - "!**/.bin{,/**}"
      - "!.vite{,/**}"
      - "!{vite,vitest,rolldown,lightningcss,lightningcss-darwin-arm64,@vitest,@rolldown,@oxc-project}{,/**}"
      # better-sqlite3 をソースから作り直したときの中間生成物(.o や .a は署名できない)
      - "!**/better-sqlite3/build/Release/{obj,obj.target,.deps}{,/**}"
      - "!**/better-sqlite3/build/{deps,src,Makefile,config.gypi,*.mk,*.Makefile,binding.Makefile}{,/**}"
      - "!**/better-sqlite3/build/Release/test_extension.node"
      - "!**/better-sqlite3/{deps,src}{,/**}"
      - "!**/*.{o,a}"
      - "!**/@types/**"
      - "!**/test{,s}/**"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/{README,readme,CHANGELOG,changelog}.md"
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/node-pty/**"
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 署名はローカル用の自己署名(公証しない)なので時刻証明は不要。研究室 LAN は外向き HTTP 不可で timestamp.apple.com に届かない
  timestamp: none
dmg:
  title: "${productName}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

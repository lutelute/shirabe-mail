<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#ECE5D6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34679A"/>
      <stop offset="1" stop-color="#244B73"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- macOS の squircle 相当(824x824) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="#E2DACA" stroke-width="4"/>
  <!-- 罫線(机の上の便箋) -->
  <g stroke="#E6DFD0" stroke-width="6" stroke-linecap="round">
    <line x1="236" y1="792" x2="788" y2="792"/>
    <line x1="236" y1="846" x2="640" y2="846"/>
  </g>
  <!-- 墨の影 -->
  <text x="520" y="516" text-anchor="middle" dominant-baseline="central" font-family="Hiragino Mincho ProN, Hiragino Mincho Pro, serif" font-weight="600" font-size="470" fill="#1F2328" opacity="0.10" filter="url(#soft)">調</text>
  <!-- 調 -->
  <text x="512" y="508" text-anchor="middle" dominant-baseline="central" font-family="Hiragino Mincho ProN, Hiragino Mincho Pro, serif" font-weight="600" font-size="470" fill="url(#ink)">調</text>
  <!-- 朱点(今日の印) -->
  <circle cx="792" cy="236" r="46" fill="#C8502E"/>
  <circle cx="776" cy="220" r="14" fill="#E2785A" opacity="0.8"/>
</svg>
